<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>链证出海 · 海上船队动态预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#dceaf2;font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;color:#142b43;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%}.veil{position:fixed;inset:0;background:linear-gradient(180deg,#ffffff38 0%,#ffffff52 30%,#ffffff36 49%,transparent 75%);pointer-events:none}header{position:absolute;top:30px;left:40px;font-weight:650;font-size:21px;display:flex;gap:12px;align-items:center}header span{color:#2871d1;font-size:28px}.hero{position:absolute;top:28%;width:100%;text-align:center;padding:0 20px}.eyebrow{display:inline-block;font-size:12px;border:1px solid #ffffff80;border-radius:30px;background:#ffffff73;padding:7px 16px;backdrop-filter:blur(10px)}h1{font-size:clamp(32px,4.1vw,64px);font-weight:650;letter-spacing:-2px;line-height:1.35;margin:24px 0}h1 span{color:#425b73}.subtitle{font-size:clamp(13px,1.2vw,18px);color:#344e67;line-height:1.8}button{border:0;border-radius:30px;padding:15px 32px;background:#2465e9;color:white;font:inherit;font-size:16px;margin-top:26px;box-shadow:0 8px 25px #193f7e26;cursor:pointer}footer{position:absolute;bottom:22px;width:100%;text-align:center;color:#ffffffdd;font-size:12px;text-shadow:0 1px 5px #183a60}.preview-label{position:absolute;bottom:20px;left:24px;color:#ffffffc9;font-size:10px}.loading{position:absolute;bottom:50px;width:100%;text-align:center;font-size:12px} @media(max-width:600px){header{left:22px;top:22px;font-size:18px}.hero{top:25%}h1 span{display:block}.preview-label{bottom:45px;width:100%;left:0;text-align:center}.subtitle{max-width:310px;margin:auto}}
</style>
<canvas id="sea" aria-hidden="true"></canvas><div class="veil"></div>
<header><span>▱</span>链证出海</header>
<main class="hero"><div class="eyebrow">出海资料预审智能体</div><h1>资料有据，<span>出海有序。</span></h1><p class="subtitle">核对产品资料，追溯证据来源，理清补件事项。</p><button type="button" onclick="this.textContent='首页背景效果预览'">开始体验　→</button></main>
<div id="loading" class="loading">正在加载海面与船队…</div><footer>链证出海 · 辅助资料预审</footer><div class="preview-label">独立动态预览 · 持续循环 · 尚未替换网站背景</div>
<script>
'use strict';
const canvas=document.getElementById('sea'),ctx=canvas.getContext('2d');
const ocean=new Image();ocean.src='sea.png';
const images={};
for(const name of ['boat','cruise','cargo']){images[name]=new Image();images[name].src=name+'.png';}
let w=innerWidth,h=innerHeight;
function resize(){w=innerWidth;h=innerHeight;const dpr=Math.min(devicePixelRatio,1.5);canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
// 船体大小、行进速度与随浪响应区分，避免整齐划一地上下摆动。
const ships=[
 {type:'boat',x:.08,y:.91,width:.10,speed:.0018,phase:0,response:1,direction:1,trim:.99},
 {type:'cargo',x:.37,y:.88,width:.17,speed:.0012,phase:1.8,response:.3,direction:1,trim:.9},
 {type:'cruise',x:.78,y:.94,width:.21,speed:.0015,phase:3.7,response:.45,direction:-1,trim:.97},
 {type:'boat',x:.92,y:.84,width:.045,speed:.001,phase:5,response:.8,direction:1,trim:.99}
].sort((a,b)=>a.y-b.y);
function surface(x,t,phase){return Math.sin(x*.008-t*.6+phase)+.3*Math.sin(x*.017-t*.93+phase*.7)}
function drawShip(ship,t){
 const image=images[ship.type],sourceHeight=image.height*ship.trim;
 const bw=Math.min(w*ship.width,h*ship.width*2.15),bh=bw*sourceHeight/image.width;
 const span=w+bw*2,position=ship.x*w+ship.direction*t*ship.speed*w;
 const x=((position+bw)%span+span)%span-bw;
 const sway=surface(x+bw/2,t,ship.phase),y=h*ship.y+sway*(.65+ship.response*.85);
 const roll=(Math.sin(x*.008-t*.6+ship.phase)*.0035+.2*Math.sin(t*.93+ship.phase)*.004)*ship.response;
 // 微弱水面倒影与沿航向渐隐的尾流，把船体锚定在水线附近。
 ctx.save();ctx.translate(x+bw/2,y);ctx.scale(ship.direction,1);
 const wake=ctx.createLinearGradient(-bw*1.2,0,-bw*.35,0);wake.addColorStop(0,'rgba(225,246,255,0)');wake.addColorStop(1,'rgba(239,251,255,.3)');
 ctx.strokeStyle=wake;ctx.lineWidth=1;ctx.beginPath();
 ctx.moveTo(-bw*.38,1);ctx.quadraticCurveTo(-bw*.85,2+sway,-bw*1.3,7+sway);
 ctx.moveTo(-bw*.38,1);ctx.quadraticCurveTo(-bw*.85,1-sway,-bw*1.3,-2-sway);ctx.stroke();
 ctx.save();ctx.globalAlpha=.07;ctx.translate(0,2);ctx.scale(1,-.13);ctx.drawImage(image,0,0,image.width,sourceHeight,-bw/2,-bh,bw,bh);ctx.restore();
 ctx.rotate(roll);ctx.drawImage(image,0,0,image.width,sourceHeight,-bw/2,-bh,bw,bh);ctx.restore();
}
Promise.all([ocean.decode(),...Object.values(images).map(image=>image.decode())]).then(()=>{
 document.getElementById('loading').hidden=true;
 // 后台切回时冻结流逝时间，避免船只突然跳位。
 let previous=performance.now(),elapsed=0;
 function frame(now){
  elapsed+=Math.min((now-previous)/1000,.05);previous=now;
  const t=elapsed,scale=Math.max(w/ocean.width,h/ocean.height),sw=w/scale,sh=h/scale,sx=(ocean.width-sw)/2,sy=(ocean.height-sh)/2;
  ctx.drawImage(ocean,sx,sy,sw,sh,0,0,w,h);
  for(let y=Math.floor(h*.43);y<h;y+=2){const depth=(y/h-.43)/.57,shift=(Math.sin(y*.028-t*.35)+.25*Math.sin(y*.057-t*.61))*depth*1.25;ctx.drawImage(ocean,sx,sy+y/scale,sw,2/scale,shift,y,w+2,2.2)}
  for(const ship of ships)drawShip(ship,t);
  requestAnimationFrame(frame);
 }
 requestAnimationFrame(frame);
}).catch(()=>{document.getElementById('loading').textContent='素材加载失败，请确认sea.png、boat.png、cruise.png、cargo.png与本页位于同一目录。'});
</script>
</html>
