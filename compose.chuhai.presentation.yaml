# 独立展示入口：现有 web、API 与数据保持运行。
services:
  chuhai-presentation:
    image: ${COMPOSE_PROJECT_NAME:-yuxi}-presentation:${YUXI_VERSION:-0.7.3}
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: production
    ports:
      - "127.0.0.1:${CHUHAI_PRESENTATION_PORT:-25179}:80"
    volumes:
      - ./docker/nginx/chuhai-presentation.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network
    depends_on:
      - web
    restart: unless-stopped
