server {
    listen 80;
    server_name localhost;

    # Docker DNS 允许开发服务重建后重新解析其地址。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $development_web http://web:5173;

    location / {
        gzip on;
        gzip_vary on;
        gzip_comp_level 4;
        gzip_min_length 1024;
        gzip_types text/css application/javascript text/javascript image/svg+xml;
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # 继续使用现有 Vite 的 API 代理，保留认证、上传及 SSE 的既有行为。
    location ^~ /api {
        client_max_body_size 0;
        proxy_pass $development_web$request_uri;
        proxy_set_header Host localhost:5173;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
    }

    # 原有 Vite 代理负责重写公开对象路径。
    location ^~ /minio/public/ {
        client_max_body_size 0;
        proxy_pass $development_web$request_uri;
        proxy_set_header Host localhost:5173;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
    }
}
